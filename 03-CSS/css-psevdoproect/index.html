<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Любимка</title>
    <style>
        body {
            background-color: hsla(188, 80%, 48%, 0.989);
        }

        .div1 {
            background-color: rgb(240, 255, 255);
            border: 5px solid #0594e1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;

        }

        .grid {
            position: relative;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item h1 {
            font-size: 22px;
            margin: 0;
            /* Убираем встроенный margin браузера, который всё ломал */
            height: 60px;
            /* Фиксированная высота для текста (хватит даже на 2 строки) */
            display: flex;
            align-items: center;
            /* Центрируем текст по вертикали внутри его зоны */
            justify-content: center;
            /* Центрируем текст по горизонтали */
        }

        .item {
            border: solid;
            background-color: rgb(240, 255, 255);
            height: 600px;
            border: 4px solid #0594e1;
            text-align: center;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-sizing: border-box;
            padding: 10px;
            transition: transform 0.3s ease-in-out;
        }

        .item:hover {
            transform: scale(1.05);
        }

        .img-container {
            width: 100%;
            flex-grow: 1;
            min-height: 0;

        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Картинка заполнит область без искажения пропорций */
            border-radius: 6px;
            border: solid #0594e1;
            /* Скругление углов самой картинки */
            box-sizing: border-box
        }

        .div3 {
            font-size: 30px;
            background-color: rgb(240, 255, 255);
            border: solid;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            margin-top: 30px;
            border: 5px solid #0594e1;
        }
    </style>
</head>

<body>
    <!!! Заглавная надпись !!!>
        <div class="div1">
            <h1>Личности сахарной кошки</h1>
        </div>

        <div class="grid">
            <div class="item">
                <h1>Адмирал</h1>
                <div class="img-container"><img src="IMG_3573.jpg" alt=""> </div>
            </div>

            <div class="item">
                <h1>Гном Гномыч</h1>
                <div class="img-container"><img src="IMG_3098.jpg" alt=""></div>
            </div>
            <div class="item">
                <h1>Существо мыслящее</h1>
                <div class="img-container"><img src="IMG_4460.jpg" alt=""> </div>
            </div>
        </div>
        <div class="div3">
            <a href="https://t.me/mrtrKaleria" target="_blank" class="telegram-btn">
                Ищите меня в лесу
            </a>
        </div>
</body>

</html>
